    data-holes="M-27.9 15.4 H-27.3 V16 H-27.9 Z M-26.9 16.8 H-26.3 V17.4 H-26.9 Z M-20.5 14 H-19.9 V14.6 H-20.5 Z M-20.5 16 H-19.9 V16.6 H-20.5 Z M-12.9 17 H-12.3 V17.6 H-12.9 Z M-11.3 18.4 H-10.7 V19 H-11.3 Z M-4.9 14.6 H-4.3 V15.2 H-4.9 Z M-3.9 16.8 H-3.3 V17.4 H-3.9 Z M2.1 12.6 H2.7 V13.2 H2.1 Z M3.7 14.4 H4.3 V15 H3.7 Z M2.9 16.6 H3.5 V17.2 H2.9 Z M11.1 16 H11.7 V16.6 H11.1 Z M12.3 17.6 H12.9 V18.2 H12.3 Z M18.5 14.2 H19.1 V14.8 H18.5 Z M19.5 16.2 H20.1 V16.8 H19.5 Z M26.7 16.6 H27.3 V17.2 H26.7 Z" />
