<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -20 120 60" data-aisle="closed">
  <!--
    Station 07, the Window (contact). Floor at y=40. The end of the route: the aisle is closed by the
    window wall. The cable ends at the socket under the sill; the city is lit beyond the glass.
  -->

  <!-- the last arch: rounded shoulders, a constellation punched through its header -->
  <path id="arch" data-z="0" data-stock="navyDeep" data-cut="knife" data-cast="false"
    d="M-60 -20 H60 V40 H28 V15 Q28 9 22 9 H-22 Q-28 9 -28 15 V40 H-60 Z"
    data-holes="M-20.3 4.8 a0.3 0.3 0 1 0 0.6 0 a0.3 0.3 0 1 0 -0.6 0 Z M-16.3 3.2 a0.4 0.4 0 1 0 0.8 0 a0.4 0.4 0 1 0 -0.8 0 Z M-12.3 5.4 a0.3 0.3 0 1 0 0.6 0 a0.3 0.3 0 1 0 -0.6 0 Z M-7.3 3.8 a0.3 0.3 0 1 0 0.6 0 a0.3 0.3 0 1 0 -0.6 0 Z M4.7 4.4 a0.35 0.35 0 1 0 0.7 0 a0.35 0.35 0 1 0 -0.7 0 Z M9.7 2.8 a0.3 0.3 0 1 0 0.6 0 a0.3 0.3 0 1 0 -0.6 0 Z M14.7 5 a0.4 0.4 0 1 0 0.8 0 a0.4 0.4 0 1 0 -0.8 0 Z M19.7 3.6 a0.3 0.3 0 1 0 0.6 0 a0.3 0.3 0 1 0 -0.6 0 Z" />

  <!-- the window wall across the whole box: four panes, a sill below -->
  <path id="window-wall" data-z="-50" data-stock="navy" data-cut="knife"
    d="M-42 -20 H42 V40 H-42 Z"
    data-holes="M-15 4 H-0.6 V14.6 H-15 Z M0.6 4 H15 V14.6 H0.6 Z M-15 15.4 H-0.6 V26 H-15 Z M0.6 15.4 H15 V26 H0.6 Z" />
