<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -20 120 60">
  <!--
    Station 02, the Control Room (OT Observability Lab). Floor at y=40, aisle |x| < 8 below y=18.
    A gas line with its valve wheel, a pressure gauge whose needle never quite rests, a mimic panel,
    and a small rack of status lights.
  -->

  <!-- a pipe-arch: rounded shoulders, bolted flanges on both jambs -->
  <path id="arch" data-z="0" data-stock="tealDeep" data-cut="knife" data-cast="false"
    d="M-60 -20 H60 V40 H28 V30.6 H26.2 V29 H28 V21.6 H26.2 V20 H28 V16 Q28 9 21 9 H-21 Q-28 9 -28 16 V20 H-26.2 V21.6 H-28 V29 H-26.2 V30.6 H-28 V40 H-60 Z"
    data-holes="M-27.35 20.8 a0.35 0.35 0 1 0 0.7 0 a0.35 0.35 0 1 0 -0.7 0 Z M-27.35 29.8 a0.35 0.35 0 1 0 0.7 0 a0.35 0.35 0 1 0 -0.7 0 Z M26.65 20.8 a0.35 0.35 0 1 0 0.7 0 a0.35 0.35 0 1 0 -0.7 0 Z M26.65 29.8 a0.35 0.35 0 1 0 0.7 0 a0.35 0.35 0 1 0 -0.7 0 Z" />

  <!-- far: the manifold, a header pipe across the back with drops at each side -->
  <path id="far-manifold" data-z="-42" data-stock="copper" data-cut="knife"
    d="M-36 10.2 H36 V11.8 H-36 Z M-25 11.8 H-23.4 V40 H-25 Z M23.4 11.8 H25 V40 H23.4 Z M-25.6 22 H-22.8 V23.2 H-25.6 Z M22.8 22 H25.6 V23.2 H22.8 Z M-14.6 9.4 H-12.8 V12.6 H-14.6 Z M12.8 9.4 H14.6 V12.6 H12.8 Z" />

  <!-- middle B: the mimic panel (left), the status rack (right) with its lights behind the slots -->
  <path id="mimic-panel" data-z="-30" data-stock="steel" data-cut="knife"
    d="M-28 14 H-13 V40 H-28 Z"
    data-holes="M-26 17 H-15 V17.6 H-26 Z M-26 17.6 H-25.4 V24 H-26 Z M-25.4 23.4 H-19.6 V24 H-25.4 Z M-20.2 20 H-19.6 V23.4 H-20.2 Z M-19.6 20 H-15 V20.6 H-19.6 Z M-23.3 21.4 a0.7 0.7 0 1 0 1.4 0 a0.7 0.7 0 1 0 -1.4 0 Z M-17.5 26.6 a0.6 0.6 0 1 0 1.2 0 a0.6 0.6 0 1 0 -1.2 0 Z M-26 29 H-15 V29.6 H-26 Z M-26 32 H-15 V32.6 H-26 Z" />
  <path id="status-rack" data-z="-30" data-stock="graphite" data-cut="knife"
    d="M13.2 22 H21.8 V40 H13.2 Z"
    data-holes="M14.6 23.6 H18.6 V24.2 H14.6 Z M19.5 23.6 a0.35 0.35 0 1 0 0.7 0 a0.35 0.35 0 1 0 -0.7 0 Z M14.6 26.2 H18.6 V26.8 H14.6 Z M19.5 26.3 a0.35 0.35 0 1 0 0.7 0 a0.35 0.35 0 1 0 -0.7 0 Z M14.6 28.8 H18.6 V29.4 H14.6 Z M19.5 29 a0.35 0.35 0 1 0 0.7 0 a0.35 0.35 0 1 0 -0.7 0 Z M14.6 31.4 H18.6 V32 H14.6 Z M19.5 31.7 a0.35 0.35 0 1 0 0.7 0 a0.35 0.35 0 1 0 -0.7 0 Z" />
  <path id="status-lights" data-z="-30.4" data-stock="glowGreen"
    d="M19.3 23.2 H20.4 V32.4 H19.3 Z" />

  <!-- stage: the gas line (left) rising out of the floor and elbowing into the wall -->
  <path id="gas-line" data-z="-16" data-stock="sunflower" data-cut="knife"
    d="M-19.8 40 V26.4 Q-19.8 21.6 -24.6 21.6 H-30 V19.4 H-24.6 Q-17.6 19.4 -17.6 26.4 V40 Z M-20.6 35.2 H-16.8 V36.4 H-20.6 Z M-20.6 27.4 H-16.8 V28.6 H-20.6 Z" />
  <path id="valve-wheel" data-z="-15.4" data-stock="tomato" data-pivot="-18.7 31.8" data-cut="knife"
    d="M-18.7 29.4 a2.4 2.4 0 1 0 0.001 0 Z M-19.2 31.8 H-18.2 V33.4 H-19.2 Z"
    data-holes="M-18.55 30.25 A1.6 1.6 0 0 1 -17.25 31.55 L-18.3 31.55 Q-18.4 31.4 -18.55 31.35 Z M-17.25 32.05 A1.6 1.6 0 0 1 -18.55 33.35 L-18.55 32.25 Q-18.4 32.2 -18.3 32.05 Z M-18.85 33.35 A1.6 1.6 0 0 1 -20.15 32.05 L-19.1 32.05 Q-19 32.2 -18.85 32.25 Z M-20.15 31.55 A1.6 1.6 0 0 1 -18.85 30.25 L-18.85 31.35 Q-19 31.4 -19.1 31.55 Z" />

  <!-- the pressure gauge (right): a paper dial on a riser, the needle on its own pin -->
  <path id="gauge-riser" data-z="-16" data-stock="steel" data-cut="knife"
    d="M12.3 40 V28.4 H13.7 V40 Z M10.6 38.6 H15.4 V40 H10.6 Z M11.5 28.4 H14.5 V29.2 H11.5 Z" />
  <path id="gauge-rim" data-z="-15.6" data-stock="brass" data-cut="knife"
    d="M13 22.2 a3.2 3.2 0 1 0 0.001 0 Z" />
  <path id="gauge-face" data-z="-15.3" data-stock="cream"
    d="M13 22.8 a2.6 2.6 0 1 0 0.001 0 Z"
    data-holes="M10.9 26.9 L11.6 26.5 L11.8 26.85 L11.1 27.25 Z M11.3 24.2 L11.95 24.7 L11.7 25 L11.05 24.5 Z M12.85 23.45 H13.25 V24.25 H12.85 Z M14.75 24.2 L14.95 24.5 L14.3 25 L14.05 24.7 Z M15.1 26.9 L14.4 26.5 L14.2 26.85 L14.9 27.25 Z" />
  <path id="gauge-needle" data-z="-15" data-stock="tomato" data-pivot="13 25.4"
    d="M12.62 25.4 a0.38 0.38 0 1 0 0.76 0 L13.1 23.4 H12.9 Z" />

  <!-- hung: coils of spare cable on hooks -->
  <path id="coil-left" data-z="-34" data-stock="tomato" data-hang="-9.6 11.8"
    d="M-9.9 11.8 H-9.3 V12.8 C-7.6 13 -6.8 14.2 -6.8 15.2 C-6.8 16.6 -8 17.6 -9.6 17.6 C-11.2 17.6 -12.4 16.6 -12.4 15.2 C-12.4 14.2 -11.6 13 -9.9 12.8 Z"
    data-holes="M-9.6 13.9 C-8.6 13.9 -8 14.5 -8 15.2 C-8 15.9 -8.6 16.5 -9.6 16.5 C-10.6 16.5 -11.2 15.9 -11.2 15.2 C-11.2 14.5 -10.6 13.9 -9.6 13.9 Z" />
  <path id="coil-right" data-z="-34" data-stock="mustard" data-hang="6.4 12.6"
    d="M6.1 12.6 H6.7 V13.4 C8 13.6 8.8 14.5 8.8 15.4 C8.8 16.6 7.8 17.4 6.4 17.4 C5 17.4 4 16.6 4 15.4 C4 14.5 4.8 13.6 6.1 13.4 Z"
    data-holes="M6.4 14.4 C7.2 14.4 7.7 14.9 7.7 15.4 C7.7 16 7.2 16.4 6.4 16.4 C5.6 16.4 5.1 16 5.1 15.4 C5.1 14.9 5.6 14.4 6.4 14.4 Z" />

  <!-- detail: a pipe wrench leaning on the left jamb; a sticky note stuck behind the right wing -->
  <path id="pipe-wrench" data-z="-6" data-stock="tomato" data-cut="knife"
    d="M-26.6 40 L-25.4 30.4 L-24.5 30.5 L-25.6 40 Z M-26.2 29 H-23.6 V30 L-24.4 30.6 H-25.8 L-26.2 30.2 Z M-24.2 29 L-22.8 28.4 L-22.6 29 L-23.6 29.6 Z" />
  <path id="sticky-note" data-z="-6" data-stock="sunflower"
    d="M27.4 23.2 L30.4 23 L30.6 25.9 L27.6 26.1 Z" />
</svg>
