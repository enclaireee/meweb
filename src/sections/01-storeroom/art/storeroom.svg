<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -20 120 60">
  <!--
    Station 01, the Storeroom (DemandX). Front elevation, floor at y=40, aisle |x| < 8 below y=18.
    Racks of crates, a pallet waiting to be restocked, one crate hoisted mid-reorder, and the forecast
    pinned up where everyone can see it.
  -->

  <!-- a warehouse arch: chamfered corners like shelf gussets, vent slots in the header -->
  <path id="arch" data-z="0" data-stock="ochreDeep" data-cut="knife" data-cast="false"
    d="M-60 -20 H60 V40 H28 V14 L23 9 H-23 L-28 14 V40 H-60 Z"
    data-holes="M-17 4 H-14 V4.7 H-17 Z M-9.5 4 H-6.5 V4.7 H-9.5 Z M-1.5 4 H1.5 V4.7 H-1.5 Z M6.5 4 H9.5 V4.7 H6.5 Z M14 4 H17 V4.7 H14 Z" />

  <!-- far: tall racks against the back wall, boxes on them -->
  <path id="far-rack-left" data-z="-42" data-stock="steel" data-cut="knife"
    d="M-35 2 H-34 V40 H-35 Z M-13.2 2 H-12.2 V40 H-13.2 Z M-35 10 H-12.2 V10.7 H-35 Z M-35 19 H-12.2 V19.7 H-35 Z M-35 28 H-12.2 V28.7 H-35 Z" />
  <path id="far-boxes-left" data-z="-42" data-stock="kraft" data-cut="knife"
    d="M-33 10.2 V6.8 H-28.4 V10.2 Z M-27.6 10.2 V7.9 H-24.6 V10.2 Z M-21.4 10.2 V5.9 H-15.8 V10.2 Z M-31.8 19.2 V16.4 H-26.1 V19.2 Z M-24.4 19.2 V15.2 H-19.6 V19.2 Z M-18.2 19.2 V17.1 H-14.4 V19.2 Z M-33.4 28.2 V24.7 H-29 V28.2 Z M-22.8 28.2 V25.6 H-15 V28.2 Z" />
  <path id="far-rack-right" data-z="-42" data-stock="steel" data-cut="knife"
    d="M12.2 2 H13.2 V40 H12.2 Z M34 2 H35 V40 H34 Z M12.2 10 H35 V10.7 H12.2 Z M12.2 19 H35 V19.7 H12.2 Z M12.2 28 H35 V28.7 H12.2 Z" />
  <path id="far-boxes-right" data-z="-42" data-stock="kraft" data-cut="knife"
    d="M14.2 10.2 V7.4 H19.8 V10.2 Z M21.3 10.2 V6.2 H25.1 V10.2 Z M27.4 10.2 V8 H33 V10.2 Z M15.1 19.2 V15.6 H21.2 V19.2 Z M23.6 19.2 V16.8 H27.2 V19.2 Z M28.8 19.2 V16 H33.4 V19.2 Z M14.4 28.2 V26 H18.2 V28.2 Z M26.2 28.2 V24.2 H32.6 V28.2 Z" />

  <!-- middle: the rack the crates live on (left), and the stack behind the pallet (right) -->
  <path id="rack" data-z="-20" data-stock="blueprint" data-cut="knife"
    d="M-27.4 11.4 H-26.2 V40 H-27.4 Z M-11.6 11.4 H-10.4 V40 H-11.6 Z M-27.8 11 H-10 V12 H-27.8 Z M-27.4 21.2 H-10.4 V22 H-27.4 Z M-27.4 30.2 H-10.4 V31 H-27.4 Z" />
  <path id="stack-back" data-z="-30" data-stock="mustard" data-cut="knife"
    d="M13.4 40 V33.6 H20.6 V40 Z M14.2 33.6 V28.8 H19.6 V33.6 Z M21.4 40 V35.2 H26.8 V40 Z"
    data-holes="M15.9 30.4 H17.9 V31.1 H15.9 Z M22.9 36.6 H25.2 V37.3 H22.9 Z" />

  <!-- stage: crates, hand-placed a hair off-true, handles cut through; one carries FZ in stencil -->
  <path id="crates-top" data-z="-16" data-stock="kraft" data-cut="knife"
    d="M-26 21.2 L-26.1 16.9 L-21.2 16.8 L-21.1 21.2 Z M-20.3 21.2 V18.2 L-16.7 18.1 V21.2 Z M-15.9 21.2 L-15.8 19 H-12.2 L-12.1 21.2 Z"
    data-holes="M-24.4 17.8 H-22.6 V18.4 H-24.4 Z M-19.4 18.9 H-17.6 V19.5 H-19.4 Z M-14.8 19.6 H-13.2 V20.1 H-14.8 Z" />
  <path id="crates-mid" data-z="-16" data-stock="tomato" data-cut="knife"
    d="M-25.7 30.2 L-25.5 25.4 L-19.9 25.5 L-19.8 30.2 Z M-18.9 30.2 V25.9 H-11.3 V30.2 Z"
    data-holes="M-23.6 26.3 H-21.8 V26.9 H-23.6 Z M-18 27.1 H-12.2 V27.45 H-18 Z M-18 28.6 H-12.2 V28.95 H-18 Z" />
  <path id="crate-fz" data-z="-16" data-stock="kraftDeep" data-cut="knife"
    d="M-26.3 40 L-26.2 34.6 H-19.4 L-19.3 40 Z"
    data-holes="M-25.6 35.5 H-25 V38.4 H-25.6 Z M-25 35.5 H-23.4 V36.1 H-25 Z M-25 36.7 H-23.9 V37.3 H-25 Z M-22.8 35.5 H-20.2 V36.1 L-21.9 37.8 H-20.2 V38.4 H-22.8 V37.8 L-21.1 36.1 H-22.8 Z" />

  <!-- the pallet, and the two crates already restocked on it -->
  <path id="pallet" data-z="-14" data-stock="wood" data-cut="knife"
    d="M9.6 38.4 H25.2 V39 H9.6 Z M9.8 39 H11.4 V40 H9.8 Z M16.6 39 H18.2 V40 H16.6 Z M23.4 39 H25 V40 H23.4 Z" />
  <path id="pallet-crates" data-z="-14" data-stock="kraft" data-cut="knife"
    d="M10.4 38.4 L10.5 33.8 L16.6 33.9 L16.5 38.4 Z M17.6 38.4 V34.6 L23.8 34.5 L23.9 38.4 Z"
    data-holes="M12.6 35 H14.4 V35.6 H12.6 Z M19.8 35.6 H21.6 V36.2 H19.8 Z" />

  <!-- mid-reorder: a crate on the hoist, swinging on its rope -->
  <path id="hoisted-crate" data-z="-34" data-stock="tomato" data-hang="17.2 10.4" data-cut="knife"
    d="M16.8 10.4 H17.6 V12 L20.2 13.6 V18.4 H14.2 V13.6 L16.8 12 Z"
    data-holes="M16.3 15 H18.1 V15.6 H16.3 Z" />

  <!-- the forecast, pinned up on a card: actuals, then the dashed forecast that won -->
  <path id="forecast-card" data-z="-34" data-stock="white" data-hang="0 12.4" data-cut="knife"
    d="M-5.6 12.4 H5.6 V17.6 H-5.6 Z"
    data-holes="M-4.8 16.4 L-3.2 15.2 L-2 15.9 L-0.6 14.2 L0.3 14.7 L0.3 15.1 L-0.5 14.7 L-1.9 16.4 L-3.1 15.6 L-4.6 16.8 Z M1 14.2 L1.8 13.9 L1.9 14.25 L1.1 14.55 Z M2.6 13.7 L3.4 13.4 L3.5 13.75 L2.7 14.05 Z M4.1 13.2 L4.8 12.95 L4.9 13.3 L4.2 13.55 Z" />

  <!-- detail near the arch: a hand truck, and a reorder tag hiding behind the right wing -->
  <path id="hand-truck" data-z="-6" data-stock="tomato" data-cut="knife"
    d="M-26.8 40 L-25.9 30 H-25.1 L-25.8 38.9 H-21.6 V40 Z M-26.4 31.6 H-24.4 V32.2 H-26.4 Z M-24.9 38.4 a1 1 0 1 0 2 0 a1 1 0 1 0 -2 0 Z" />
  <path id="reorder-tag" data-z="-6" data-stock="sunflower"
    d="M27.2 30 L30.6 30 L31.4 30.8 L31.4 33.6 L27.2 33.6 Z"
    data-holes="M30.3 30.6 a0.3 0.3 0 1 0 0.6 0 a0.3 0.3 0 1 0 -0.6 0 Z M28 31.8 H30.2 V32.2 H28 Z" />
</svg>
