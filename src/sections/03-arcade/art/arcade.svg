  <path id="pixel-heart" data-z="-34" data-stock="tomato" data-hang="9 12.8" data-cut="knife"
    d="M8.1 13.6 H8.8 V12.8 H9.2 V13.6 H9.9 V14.3 H10.6 V15.7 H9.9 V16.4 H9.2 V17.1 H8.8 V16.4 H8.1 V15.7 H7.4 V14.3 H8.1 Z" />

  <!-- detail: a joystick on the floor; a pixel ghost peeking round the left wing -->
  <path id="joystick" data-z="-6" data-stock="tomato" data-cut="knife"
    d="M23.6 40 V37.2 H28.8 V40 Z M25.9 37.2 V34.4 H26.5 V37.2 Z M25.2 34 a1 1 0 1 0 2 0 a1 1 0 1 0 -2 0 Z M27.4 36.4 a0.4 0.4 0 1 0 0.8 0 a0.4 0.4 0 1 0 -0.8 0 Z" />
  <path id="pixel-ghost" data-z="-6" data-stock="mint" data-cut="knife"
    d="M-31 40 V35.6 H-30.4 V35 H-27.6 V35.6 H-27 V40 H-27.6 V39.4 H-28.2 V40 H-28.8 V39.4 H-29.4 V40 H-30 V39.4 H-30.4 V40 Z"
    data-holes="M-30.1 36.2 H-29.5 V37 H-30.1 Z M-28.6 36.2 H-28 V37 H-28.6 Z" />
</svg>
